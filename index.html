<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>市長診断RPG</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="stage">
    <div id="view-frame">
      <div id="view">
        <div id="scene"></div>
        <div id="sprites"></div>
      </div>
    </div>
    <div id="hud">
      <div id="header" hidden></div>
      <div id="gauges" class="box" hidden></div>
      <div id="window" class="box" hidden><span class="speaker" hidden></span><span class="text"></span><span class="more" hidden>▼</span></div>
      <div id="menu" class="box" hidden></div>
      <div id="name-entry" class="box" hidden><input id="name-input" type="text" autocomplete="off" spellcheck="false"><button id="name-ok" type="button" data-act="ok">けってい</button></div>
      <div id="confirm" class="box" hidden></div>
    </div>
    <div id="touchbar">
      <button type="button" data-act="back">◀ 1問もどる</button>
      <button type="button" data-act="mute">♪ 音</button>
      <button type="button" data-act="escape">⌂ タイトル</button>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/scoring.js"></script>
  <script src="js/game.js"></script>
  <script src="js/input.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/art.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
